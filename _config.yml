# The Site Configuration
title: 반도체 인사이트 리포트
tagline: 매일 아침 업데이트되는 글로벌 반도체 & AI 기술 동향
url: 'https://sssemimaster.github.io'
baseurl: '/semiconNEWS_Blog'
lang: ko-KR
timezone: Asia/Seoul

theme: jekyll-theme-chirpy

description: >-
  매일 아침 업데이트되는 글로벌 반도체 & AI 기술 동향 리포트입니다.

github:
  username: sssemimaster

social:
  name: sssemimaster
  links:
    - https://github.com/sssemimaster

paginate: 10

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
