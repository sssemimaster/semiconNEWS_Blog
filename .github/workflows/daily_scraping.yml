name: Daily Semiconductor Blog Poster

on:
  schedule:
    # UTC 기준 20:00 = 한국 시간(KST) 새벽 05:00
    - cron: '0 20 * * *'
  workflow_dispatch:

# 리포지토리에 파일을 쓰고(Push) 수정할 수 있는 권한 부여
permissions:
  contents: write

jobs:
  run-poster:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 불러오기
      uses: actions/checkout@v4

    - name: 파이썬 환경 설정
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 패키지 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 뉴스 스크랩 및 마크다운 파일 생성
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        python src/main.py
        
    - name: 변경된 파일을 GitHub에 커밋 및 푸시
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add _posts/
        # 변경된 사항이 있을 때만 커밋 (에러 방지)
        git commit -m "📝 Auto-post: 오늘의 반도체 뉴스 블로그 업로드" || echo "No changes to commit"
        git push
