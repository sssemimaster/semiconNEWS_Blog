name: Daily Semiconductor News & Wiki Scraping

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  scrape_and_post:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GH_PAT }}

    - name: 파이썬 환경 설정
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 필요 패키지 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 1. 일일 공정/소재 뉴스 브리핑 생성
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        UNSPLASH_API_KEY: ${{ secrets.UNSPLASH_API_KEY }} # 💡 이미지 API 키 추가
      run: |
        python src/main.py

    - name: 2. 반도체 기술 백과사전 위키 생성
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        UNSPLASH_API_KEY: ${{ secrets.UNSPLASH_API_KEY }} # 💡 이미지 API 키 추가
      run: |
        python src/concept.py

    - name: GitHub 저장소에 커밋 및 푸시
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add _posts/
        git commit -m "docs: 🧪 화공학도 일일 뉴스 브리핑 & 기술 백과사전 자동 업데이트" || echo "No changes to commit"
        git push origin main
