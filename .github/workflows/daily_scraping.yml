name: Daily Semiconductor News Scraping

on:
  schedule:
    - cron: '0 20 * * *' # 매일 한국 시간 오전 5시 실행
  workflow_dispatch:

jobs:
  scrape_and_post:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GH_PAT }}

    - name: 파이썬 환경 설정
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 필요 패키지 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 뉴스 스크랩 및 마크다운 파일 생성
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        python src/main.py

    - name: GitHub 저장소에 변경사항 커밋 및 푸시
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add _posts/
        git commit -m "docs: 🤖 오늘자 반도체 뉴스 블로그 포스팅 자동 추가" || echo "No changes to commit"
        git push origin main
